name: Daily Search Index Generator Cron

on:
  schedule:
    # Runs daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Search Index
        run: npm run generate:search-index

      - name: Commit & Push updated search_index.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cron): auto-update public/search_index.json"
          file_pattern: "public/search_index.json"
