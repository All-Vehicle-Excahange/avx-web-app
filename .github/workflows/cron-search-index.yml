name: Daily Search Index Generator Cron

on:
  schedule:
    # Runs daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate state geo sitemaps
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run generate:sitemaps
        continue-on-error: true

      - name: Generate Search Index
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run generate:search-index

      - name: Commit & Push updated SEO files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cron): auto-update search_index.json and geo sitemaps"
          file_pattern: "public/search_index.json public/sitemaps/*.xml public/sitemap.xml"

      - name: Notify Google (Indexing API + GSC sitemap)
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: npm run notify:seo
        continue-on-error: true
